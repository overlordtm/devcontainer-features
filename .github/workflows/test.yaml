name: "Test Dev Container Features"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autogenerated-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Microsoft publishes a rolling "latest" tag for each supported base
        # distribution: debian, ubuntu, and alpine.
        baseImage:
          - mcr.microsoft.com/devcontainers/base:debian
          - mcr.microsoft.com/devcontainers/base:ubuntu
          - mcr.microsoft.com/devcontainers/base:alpine
        feature:
          - claude-code
          - claude-code-persistence
          - opencode-persistence
          - opencode-cli
          - direnv
          - shell-history
          - omz-plugins
          - glab-cli
          - gh-cli
          - gh-cli-persistence
          - opentofu-cli
          - sops-cli
          - age-cli
          - gcx-cli
          - gcx-cli-persistence
          - gitleaks-cli
          - gcloud-cli
          - gcloud-cli-persistence
          - aws-cli
          - aws-cli-persistence
          - tflint-cli
          - uv-cli
          - ruff-cli
          - fj-cli
          - fj-cli-persistence
          - manage-packages
        exclude:
          # fj-cli only publishes glibc binaries. The Alpine base image does not
          # include Cargo, so the documented musl fallback cannot run there.
          - feature: fj-cli
            baseImage: mcr.microsoft.com/devcontainers/base:alpine
          # The Google Cloud CLI and AWS CLI v2 Linux bundles are linked
          # against glibc and are not supported on musl-based Alpine.
          - feature: gcloud-cli
            baseImage: mcr.microsoft.com/devcontainers/base:alpine
          - feature: aws-cli
            baseImage: mcr.microsoft.com/devcontainers/base:alpine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dev Container CLI
        run: npm install -g @devcontainers/cli

      - name: Test ${{ matrix.feature }} on ${{ matrix.baseImage }}
        run: >-
          devcontainer features test
          --skip-scenarios
          -f ${{ matrix.feature }}
          -i ${{ matrix.baseImage }}
          --project-folder .

  scenario-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - claude-code
          - claude-code-persistence
          - opencode-persistence
          - opencode-cli
          - direnv
          - shell-history
          - omz-plugins
          - glab-cli
          - gh-cli
          - gh-cli-persistence
          - opentofu-cli
          - sops-cli
          - age-cli
          - gcx-cli
          - gcx-cli-persistence
          - gitleaks-cli
          - gcloud-cli
          - gcloud-cli-persistence
          - aws-cli
          - aws-cli-persistence
          - tflint-cli
          - uv-cli
          - ruff-cli
          - fj-cli
          - fj-cli-persistence
          - manage-packages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dev Container CLI
        run: npm install -g @devcontainers/cli

      - name: Test ${{ matrix.feature }} scenarios
        run: >-
          devcontainer features test
          --skip-autogenerated
          --skip-duplicated
          -f ${{ matrix.feature }}
          --project-folder .
