name: "Test Dev Container Features"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autogenerated-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - feature: claude-code
            baseImage: debian:trixie
          - feature: claude-code-persistence
            baseImage: debian:trixie
          - feature: opencode-persistence
            baseImage: debian:trixie
          - feature: opencode-cli
            baseImage: debian:trixie
          - feature: direnv
            baseImage: debian:trixie
          - feature: glab-cli
            baseImage: debian:trixie
          - feature: fj-cli
            baseImage: debian:trixie
          - feature: fj-cli-persistence
            baseImage: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dev Container CLI
        run: npm install -g @devcontainers/cli

      - name: Test ${{ matrix.feature }}
        run: >-
          devcontainer features test
          --skip-scenarios
          -f ${{ matrix.feature }}
          -i ${{ matrix.baseImage }}
          --project-folder .

  scenario-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - claude-code
          - claude-code-persistence
          - opencode-persistence
          - opencode-cli
          - direnv
          - glab-cli
          - fj-cli
          - fj-cli-persistence
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dev Container CLI
        run: npm install -g @devcontainers/cli

      - name: Test ${{ matrix.feature }} scenarios
        run: >-
          devcontainer features test
          --skip-autogenerated
          --skip-duplicated
          -f ${{ matrix.feature }}
          --project-folder .
