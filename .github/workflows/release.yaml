name: "Release Dev Container Features"

# Publish only after the "Test Dev Container Features" workflow has completed
# successfully for a push to main, so untested features never reach GHCR.
on:
  workflow_run:
    workflows: ["Test Dev Container Features"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: features-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Publish the exact commit whose tests passed instead of the
          # (possibly newer) tip of main.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      # Packages each folder in ./src as a devcontainer-feature-<id>.tgz and
      # pushes it to ghcr.io/<owner>/<repo>/<id> using the OCI artifact
      # distribution format. It also publishes the devcontainer-collection.json
      # metadata at ghcr.io/<owner>/<repo>:latest.
      - name: Publish Features to GHCR
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "./src"
          generate-docs: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
